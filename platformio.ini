[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  majicdesigns/MD_MAX72XX @ ^3.5.1
  bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-c3-debug]
extends = env:esp32-c3-devkitm-1
build_type = debug
debug_tool = esp-builtin
; La carga por JTAG integrado resultó inestable durante escrituras largas.
; Se carga por el bootloader USB serie y se usa JTAG solamente para depurar.
upload_protocol = esptool
upload_port = COM4
debug_speed = 1000
debug_load_mode = manual
debug_init_break = tbreak setup
debug_build_flags = -Og -g3 -ggdb3
debug_extra_cmds =
  set substitute-path /home/runner/work/esp32-arduino-lib-builder/esp32-arduino-lib-builder/esp-idf/components C:/Users/Matias/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32c3/include
platform_packages =
  tool-openocd-esp32 @ file://.pio/openocd-esp32-20260703/openocd-esp32
